services:
  - type: web
    name: conectabyte-api
    runtime: node
    plan: free
    buildCommand: npm_config_build_from_source=true npm ci
    startCommand: npm run start:demo
    healthCheckPath: /produtos
    envVars:
      - key: NODE_VERSION
        value: 24.13.1
      - key: NODE_ENV
        value: production
